spring.application.name=demo

# PostgreSQL Configuration (use env vars in Render)
# Example: SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cubetimer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:13052006}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Server port from hosting provider (Render provides PORT)
server.port=${PORT:8080}
